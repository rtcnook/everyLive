name: Package All Platforms

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: package-all-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Package Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36 platform
        run: sdkmanager 'platforms;android-36'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Assemble debug APK
        run: ./gradlew :composeApp:assembleDebug --stacktrace

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: everylive-android-debug
          path: composeApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  desktop-linux:
    name: Package desktop Linux app
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36 platform
        run: sdkmanager 'platforms;android-36'

      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Package desktop distribution
        run: ./gradlew :composeApp:packageDistributionForCurrentOS --stacktrace

      - name: Upload desktop package
        uses: actions/upload-artifact@v4
        with:
          name: everylive-desktop-linux
          path: composeApp/build/compose/binaries/main/*/*
          if-no-files-found: error

  web-js:
    name: Package JavaScript web app
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36 platform
        run: sdkmanager 'platforms;android-36'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build JavaScript browser distribution
        run: ./gradlew :composeApp:jsBrowserDistribution --stacktrace

      - name: Upload JavaScript distribution
        uses: actions/upload-artifact@v4
        with:
          name: everylive-web-js
          path: composeApp/build/dist/js/productionExecutable
          if-no-files-found: error

  web-wasm:
    name: Package Wasm web app
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36 platform
        run: sdkmanager 'platforms;android-36'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build Wasm browser distribution
        run: ./gradlew :composeApp:wasmJsBrowserDistribution --stacktrace

      - name: Upload Wasm distribution
        uses: actions/upload-artifact@v4
        with:
          name: everylive-web-wasm
          path: composeApp/build/dist/wasmJs/productionExecutable
          if-no-files-found: error

  ios:
    name: Compile iOS simulator framework
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36 platform
        run: sdkmanager 'platforms;android-36'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Link debug iOS simulator framework
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64 --stacktrace

      - name: Upload iOS simulator framework
        uses: actions/upload-artifact@v4
        with:
          name: everylive-ios-simulator-framework
          path: composeApp/build/bin/iosSimulatorArm64/debugFramework/*.framework
          if-no-files-found: error

  server:
    name: Package server distribution
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36 platform
        run: sdkmanager 'platforms;android-36'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Package server distribution
        run: ./gradlew :server:distZip --stacktrace

      - name: Upload server distribution
        uses: actions/upload-artifact@v4
        with:
          name: everylive-server
          path: server/build/distributions/*.zip
          if-no-files-found: error
