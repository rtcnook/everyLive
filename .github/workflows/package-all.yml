name: Package All Platforms

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: package-all-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Package Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36 platform
        run: sdkmanager 'platforms;android-36'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Assemble debug APK
        run: ./gradlew :composeApp:assembleDebug --stacktrace

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: everylive-android-debug
          path: composeApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  desktop:
    name: Package desktop ${{ matrix.name }} installer
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            gradle: ./gradlew
            packagePath: composeApp/build/compose/binaries/main/deb/*.deb
          - name: macos
            os: macos-latest
            gradle: ./gradlew
            packagePath: composeApp/build/compose/binaries/main/dmg/*.dmg
          - name: windows
            os: windows-latest
            gradle: ./gradlew.bat
            packagePath: composeApp/build/compose/binaries/main/msi/*.msi

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36 platform
        run: sdkmanager 'platforms;android-36'

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot dpkg

      - name: Install WiX Toolset for MSI packaging
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install wixtoolset --no-progress -y
          echo 'C:\Program Files (x86)\WiX Toolset v3.14\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        if: runner.os != 'Windows'
        run: chmod +x ./gradlew

      - name: Package desktop installer for current OS
        run: ${{ matrix.gradle }} :composeApp:packageDistributionForCurrentOS --stacktrace

      - name: Upload desktop installer
        uses: actions/upload-artifact@v4
        with:
          name: everylive-desktop-${{ matrix.name }}
          path: ${{ matrix.packagePath }}
          if-no-files-found: error

  web-js:
    name: Package JavaScript web app
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36 platform
        run: sdkmanager 'platforms;android-36'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build JavaScript browser distribution
        run: ./gradlew :composeApp:jsBrowserDistribution --stacktrace

      - name: Upload JavaScript distribution
        uses: actions/upload-artifact@v4
        with:
          name: everylive-web-js
          path: composeApp/build/dist/js/productionExecutable
          if-no-files-found: error

  web-wasm:
    name: Package Wasm web app
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36 platform
        run: sdkmanager 'platforms;android-36'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build Wasm browser distribution
        run: ./gradlew :composeApp:wasmJsBrowserDistribution --stacktrace

      - name: Upload Wasm distribution
        uses: actions/upload-artifact@v4
        with:
          name: everylive-web-wasm
          path: composeApp/build/dist/wasmJs/productionExecutable
          if-no-files-found: error

  ios:
    name: Package iOS simulator app
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36 platform
        run: sdkmanager 'platforms;android-36'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build iOS simulator app
        run: >
          xcodebuild
          -project iosApp/iosApp.xcodeproj
          -target iosApp
          -configuration Debug
          -sdk iphonesimulator
          -derivedDataPath iosApp/build
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Upload iOS simulator app
        uses: actions/upload-artifact@v4
        with:
          name: everylive-ios-simulator-app
          path: iosApp/build/Build/Products/Debug-iphonesimulator/*.app
          if-no-files-found: error

  server:
    name: Package server distribution
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36 platform
        run: sdkmanager 'platforms;android-36'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Package server distribution
        run: ./gradlew :server:distZip --stacktrace

      - name: Upload server distribution
        uses: actions/upload-artifact@v4
        with:
          name: everylive-server
          path: server/build/distributions/*.zip
          if-no-files-found: error
